[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carbonforge"
version = "0.1.0"
description = "Build realistic nanocarbon structures and prepare complete DFT/MD calculations — band structure, Raman/IR spectra and spin-orbit coupling — for Quantum ESPRESSO, SIESTA and LAMMPS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "carbonforge contributors" }]
keywords = [
    "nanocarbon", "graphene", "CNT", "nanocoil", "DFT", "phonons",
    "Raman", "infrared", "band structure", "spin-orbit coupling",
    "Quantum ESPRESSO", "SIESTA", "LAMMPS", "materials science",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "ase>=3.22",
    "networkx>=3.0",
    # Required by the 3D preview in the GUI and by carbonforge.viz.
    # Tkinter itself ships with Python and cannot be installed via pip.
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
carbonforge = "carbonforge.cli.main:main"
# Deliberately a console script rather than a gui-script: on Windows a
# gui-script hides stdout, so a missing-Tkinter message would vanish. The
# console window is a small price for seeing errors.
carbonforge-gui = "carbonforge.gui:main"

[tool.setuptools.packages.find]
include = ["carbonforge*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["carbonforge/tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
