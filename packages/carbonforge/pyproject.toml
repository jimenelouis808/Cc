[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carbonforge"
version = "0.1.0"
description = "Build realistic nanocarbon structures and prepare complete DFT/MD calculations — band structure, Raman/IR spectra and spin-orbit coupling — for Quantum ESPRESSO, SIESTA and LAMMPS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "carbonforge contributors" }]
keywords = [
    "nanocarbon", "graphene", "CNT", "nanocoil", "DFT", "phonons",
    "Raman", "infrared", "band structure", "spin-orbit coupling",
    "Quantum ESPRESSO", "SIESTA", "LAMMPS", "materials science",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # 2.0, not 1.24: results/dos.py calls np.trapezoid, which is the 2.0
    # name for np.trapz. Declaring 1.24 made the package installable in
    # an environment where its own DOS reader raises AttributeError.
    "numpy>=2.0",
    "scipy>=1.10",
    "ase>=3.22",
    "networkx>=3.0",
    # Required by the 3D preview in the GUI and by carbonforge.viz.
    # Tkinter itself ships with Python and cannot be installed via pip.
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    # Runs across processes in CI: `pytest -n 4 --dist loadscope`, with the
    # BLAS thread count pinned to 1 so the workers do not contend for cores.
    "pytest-xdist>=3.5",
    "ruff>=0.4",
]
# The DFT engine for vibspec's IR workflow. Optional, and imported only when a
# calculation runs: GPAW publishes source only, needs a C++ compiler, libxc
# and BLAS, and does not build natively on Windows (use Ubuntu or WSL2; see
# INSTALACION.md). It is GPL-3, which is another reason not to make the MIT
# package depend on it.
gpaw = [
    "gpaw>=25.1",
]

[project.scripts]
carbonforge = "carbonforge.cli.main:main"
# Deliberately a console script rather than a gui-script: on Windows a
# gui-script hides stdout, so a missing-Tkinter message would vanish. The
# console window is a small price for seeing errors.
carbonforge-gui = "carbonforge.gui:main"

[tool.setuptools.packages.find]
include = ["carbonforge*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["carbonforge/tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: minutes each; run nightly, not on every push",
    "gpaw: needs GPAW installed (skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
