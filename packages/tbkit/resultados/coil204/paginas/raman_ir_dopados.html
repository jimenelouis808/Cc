        const colors = drawFigure(host, b); lg.innerHTML = '';
        b.series.forEach((ser, i) => { const sp = h('span'); const sw = h('i', {class: 'sw' + (b.kind === 'scatter' || b.kind === 'points' ? ' pt' : '')}); sw.style.background = colors[i]; sp.append(sw, document.createTextNode(ser.name)); lg.append(sp); });
        btn.addEventListener('click', () => { const header = [], cols = []; b.series.forEach(ser => { header.push(`${ser.name} ${b.xlabel}`, `${ser.name} ${b.ylabel}`); cols.push(ser.x, ser.y); }); const n = Math.max(...cols.map(c => c.length)); csvDownload(b.id, header, Array.from({length: n}, (_, k) => cols.map(c => c[k]))); });
      } else if (b.type === 'table') {
        const bar = h('div', {class: 'bar'}); const btn = h('button', {class: 'csv', type: 'button'}, 'CSV'); bar.append(h('h3', {}, b.title || ''), btn); s.append(bar);
        const box = h('div', {class: 'tbl'}); const t = h('table'); const tr = h('tr'); b.columns.forEach(c => tr.append(h('th', {}, c))); const th = h('thead'); th.append(tr); t.append(th);
        const tb = h('tbody'); b.rows.forEach(r => { const row = h('tr'); r.forEach((v, i) => row.append(h('td', {}, typeof v === 'number' ? fmt(v, (b.digits || [])[i]) : (v ?? '—')))); tb.append(row); }); t.append(tb); box.append(t); s.append(box);
        if (b.note) s.append(h('p', {class: 'note'}, b.note));
        btn.addEventListener('click', () => csvDownload(b.id, b.columns, b.rows));
      }
    }
  }
  const foot = h('footer', {}, R.footer || ''); root.append(foot);
}
render();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', render);
new MutationObserver(render).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
</script>
