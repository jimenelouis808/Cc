[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanocarbon_lab"
version = "0.1.0"
description = "Modular framework for generating, validating and exporting realistic nanocarbon structures for DFT (Quantum ESPRESSO) and classical MD (LAMMPS) simulations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nanocarbon_lab contributors" }]
keywords = ["nanocarbon", "graphene", "CNT", "DFT", "LAMMPS", "Quantum ESPRESSO", "materials science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "ase>=3.22",
    "networkx>=3.0",
    # Required by the 3D preview in the GUI and by nanocarbon_lab.viz.
    # Tkinter itself ships with Python and cannot be installed via pip.
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
nanocarbon = "nanocarbon_lab.cli.main:main"
# Deliberately a console script rather than a gui-script: on Windows a
# gui-script hides stdout, so a missing-Tkinter message would vanish. The
# console window is a small price for seeing errors.
nanocarbon-gui = "nanocarbon_lab.gui:main"

[tool.setuptools.packages.find]
include = ["nanocarbon_lab*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["nanocarbon_lab/tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
