[project]
name = "insitu-cells"
version = "0.1.0"
description = "Celdas electroquímicas modulares y paramétricas (CadQuery) para Raman, XRD y electrodeposición in situ"
requires-python = ">=3.10"
dependencies = ["cadquery>=2.4"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
